    <header>
        <a href="index.html" class="logo">
            <img class="logo-icon" src="images/brand/logo_white.svg" alt="Anna Burns" />
        </a>
        <nav>

            <a href="illustration.html">Art + Illustration</a>
            <a href="motion-design.html">Motion Design</a>

        <a href="index.html" class="logo">

        </nav>
    </header>
    <main>
        <div id="gameContent" onload="paint()">
            <div id="gameWindow">
                <div><a href="">back</a></div>
                <div id="paintWindow" class="center">
                    <canvas id="paintCanvas"></canvas>
                    <div class="paintMenu">
                        <div class="color" data-col="#f3f1ef">
                            <div class="colorActive"></div>
                        </div>
                        <div class="color" data-col="#A0D1CC">
                            <div class="colorActive"></div>
                        </div>
                        <div class="color" data-col="#195C80">
                            <div class="colorActive"></div>
                        </div>
                        <div class="color" data-col="#F9C437">
                            <div class="colorActive"></div>
                        </div>
                        <div class="color" data-col="#D63927">
                            <div class="colorActive"></div>
                        </div>
                        <div class="color" data-col="#241F1C">
                            <div class="colorActive"></div>
                        </div>
                        <div id="sliderContainer"><input class="slider" id="brushSize" type="range" min="1" max="30">
                        </div>
                        <button id="save">save</button>
                        <button id="clear"> clear </button>
                    </div>
                </div>
            </div>
    </main>
</body>
